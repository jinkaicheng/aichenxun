name: Daily AI News

on:
  schedule:
    # 07:33 Asia/Shanghai (UTC+8), then retry inside this run when needed.
    - cron: "33 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: daily-ai-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --ff-only origin main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Update yesterday's news with retries
        id: update_news
        shell: bash
        run: |
          target_date="$(TZ=Asia/Shanghai date -d yesterday +%F)"
          for attempt in {1..12}; do
            current_date="$(node -p "require('./public/data/latest.json').date")"
            if [ "$current_date" = "$target_date" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "${target_date} is already published; stopping retries."
              exit 0
            fi

            echo "Attempt ${attempt}/12 for ${target_date}"
            if npm run update:news && npm run validate:news; then
              updated_date="$(node -p "require('./public/data/latest.json').date")"
              if [ "$updated_date" = "$target_date" ]; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi

            if [ "$attempt" -lt 12 ]; then
              sleep 300
            fi
          done

          echo "Unable to publish ${target_date} after 12 attempts." >&2
          exit 1
      - if: steps.update_news.outputs.changed == 'true'
        run: npm run build
      - name: Commit daily digest
        if: steps.update_news.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "chore: update daily AI news"
          git push
      - name: Deploy to Cloudflare Pages
        if: steps.update_news.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/client --project-name=aichenxun --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
